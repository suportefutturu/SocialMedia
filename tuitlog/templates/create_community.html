{% extends "base.html" %}

{% block title %}Criar Comunidade{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="max-width: 500px;">
        <h1 class="auth-title">Nova Tuitcomunidade</h1>
        <p class="auth-subtitle">Crie um espaço para compartilhar interesses em comum</p>
        
        <form class="auth-form" method="POST" action="{{ url_for('create_community') }}">
            <div class="form-group">
                <label for="name" class="form-label">Nome da comunidade</label>
                <input type="text" 
                       id="name" 
                       name="name" 
                       class="form-input" 
                       required 
                       placeholder="Ex: Fotografia de Rua"
                       maxlength="100">
            </div>
            
            <div class="form-group">
                <label for="description" class="form-label">Descrição</label>
                <textarea id="description" 
                          name="description" 
                          class="form-textarea" 
                          placeholder="Sobre o que é esta comunidade?"
                          rows="4"
                          maxlength="500"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary auth-submit">
                Criar Comunidade
            </button>
        </form>
        
        <p class="auth-link" style="margin-top: 1.5rem;">
            <a href="{{ url_for('communities') }}">← Voltar para comunidades</a>
        </p>
    </div>
</div>
{% endblock %}
