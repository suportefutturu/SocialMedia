[build]

[app]
  primary_region = "gru"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "uploads_data"
  destination = "/app/static/uploads"

[env]
  FLASK_APP = "app"
  PYTHONUNBUFFERED = "1"
